name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: provider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: ["format:check", "package:check"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise release npm client setup
        if: matrix.check == 'package:check'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
      - name: Verify release client versions and registry
        if: matrix.check == 'package:check'
        run: |
          node --version
          npm --version
          registry=$(npm config get registry)
          test "${registry%/}" = "https://registry.npmjs.org"
      - run: docker compose build tools
      - run: docker compose run --rm tools npm run "${{ matrix.check }}"
      - name: Load shared archive verifier
        if: matrix.check == 'package:check'
        id: release-tools
        uses: abhi1693/actions/.github/actions/npm-release@428c8e48880754633e3b4e4f1c90c3fdc876effa # v1.1.2
      - name: Verify actual release archive
        if: matrix.check == 'package:check'
        env:
          TOOLS: ${{ steps.release-tools.outputs.path }}
        run: >-
          docker compose run --rm -v "$TOOLS:/release-tools:ro"
          -e PACKAGE_NAME=@abhi1693/medusa-payment-razorpay tools
          sh -ec 'npm run build && node /release-tools/package.mjs --check-only'

  node-checks:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, build]
    uses: abhi1693/actions/.github/workflows/node-ci.yml@v1
    with:
      node-version: "24.21.0"
      checks: ${{ format('["{0}"]', matrix.check) }}
      scripts: '{"lint":"lint","typecheck":"typecheck","build":"build"}'
      ignore-scripts: true
      enable-cache: false
  security:
    uses: abhi1693/actions/.github/workflows/security.yml@v1
    with:
      secret-scan: true
      workflow-lint: true
      npm-audit: true
      npm-directory: .
      artifact-prefix: razorpay-security
  tests:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            amounts,
            operator-command,
            financial-coordination,
            refund-acknowledgement,
            configuration,
            provider,
            http-client,
            logger,
            reconciliation,
            refund-observation,
            refund-import,
            refund-recovery,
          ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose build tools
      - run: mkdir -p test-results
      - name: Run independently selected suite
        run: >-
          docker compose run --rm -v "$PWD/test-results:/reports" tools
          npm test -- "tests/${{ matrix.suite }}.test.ts"
          --reporter=default --reporter=junit --outputFile=/reports/vitest.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/vitest.xml
          if-no-files-found: error
